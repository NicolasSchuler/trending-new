# Build standalone executables with PyInstaller and publish them as a GitHub Release.
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low so the Linux builds run on older distros.
          - { runner: ubuntu-22.04, target: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-14, target: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Build executable
        # PyInstaller needs a `.py` entry point; the script itself has no extension.
        run: |
          cp trending-new trending_new.py
          pyinstaller --onefile --name trending-new trending_new.py
      - name: Smoke test
        run: ./dist/trending-new --help
      - name: Package
        run: |
          archive="trending-new-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C dist trending-new
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum trending-new-*.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
